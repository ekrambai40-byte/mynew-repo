name: Build Dex for User App

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Compile Java and Convert to Dex
        run: |
          # প্রথমে সাধারণ জাভা ক্লাস ফাইল তৈরি (অ্যান্ড্রয়েড লাইব্রেরি ছাড়াই টেস্টের জন্য)
          javac MainActivity.java
          
          # ডি-এইট (d8) দিয়ে ডেক্স ফাইলে রূপান্তর
          d8 MainActivity.class --output .

      - name: Upload Dex Artifact
        uses: actions/upload-artifact@v4
        with:
          name: classes-dex-output
          path: classes.dex
