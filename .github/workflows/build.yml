name: Build Dex for User App

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Compile and Convert to Dex
        run: |
          # অ্যান্ড্রয়েড এসডিকে থেকে android.jar পাথ নিয়ে কম্পাইল করা
          javac -cp $ANDROID_HOME/platforms/android-34/android.jar MainActivity.java
          
          # ক্লাস ফাইলকে dex ফাইলে রূপান্তর করা
          d8 MainActivity.class --output .

      - name: Upload Dex Artifact
        uses: actions/upload-artifact@v4
        with:
          name: classes-dex-output
          path: classes.dex
