name: Build Dex for User App

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Compile and Convert to Dex
        run: |
          # অ্যান্ড্রয়েড জার ফাইল স্বয়ংক্রিয়ভাবে খুঁজে বের করে কম্পাইল করা
          ANDROID_JAR=$ANDROID_HOME/platforms/$(ls $ANDROID_HOME/platforms | head -n 1)/android.jar
          javac -cp $ANDROID_JAR MainActivity.java
          
          # ডি-এইট (d8) দিয়ে ডেক্স ফাইল তৈরি
          d8 MainActivity.class --output .

      - name: Upload Dex Artifact
        uses: actions/upload-artifact@v4
        with:
          name: classes-dex-output
          path: classes.dex
